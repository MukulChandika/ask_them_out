<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine?</title>
    <link rel="stylesheet" type="text/css" href="public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="wrapper">
      <div id="background-overlay"></div>
      <div class="container">
        <div class="banner-gif">
          <img id="banner" src="public/images/mid.gif" alt="banner" />
        </div>
        <h1 id="question-heading">Will you be my valentine?</h1>
        <div class="buttons">
          <button id="yes-button">Yes</button>
          <button id="no-button">No</button>
        </div>
        <div class="message">
          <h2 id="success-message">LETS FUCK 🍆🍑💦</h2>
          <!-- <img id="final-gif" src="public/images/final.gif" alt="celebration"> -->
          <p>Your lover <span class="creator">Mukul Chandika</span></p>
        </div>
        <div class="language-selector">
          <label for="language-select">Language:</label>
          <select id="language-select" onchange="changeLanguage()">
            <option value="english">English</option>
            <option value="telugu">తెలుగు</option>
            <option value="marathi">मराठी</option>
          </select>
        </div>
      </div>
    </div>
    <script src="public/js/script.js"></script>
  </body>
</html>
